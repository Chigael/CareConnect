<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 50" width="380" height="50" fill="none">
  <defs>
    <!-- Gradient for Icon Container: brand-600 -> teal-500 -> emerald-400 -->
    <linearGradient id="careconnect-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Icon Box (40x40, rounded 12px) -->
  <rect x="2" y="5" width="40" height="40" rx="12" ry="12" fill="url(#careconnect-grad)" filter="url(#icon-shadow)" />

  <!-- HeartHandshake Lucide Icon (White, centered inside 40x40 box at x=10, y=13) -->
  <g transform="translate(10, 13) scale(1)">
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="m18 15-2-2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="m15 18-2-2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Brand Name Typography: CareConnect -->
  <text x="52" y="27" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5">CareConnect</text>

  <!-- MVP Badge -->
  <rect x="182" y="14" width="36" height="16" rx="8" ry="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1" />
  <text x="200" y="25.5" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#0f766e" text-anchor="middle">MVP</text>

  <!-- Subtitle Tagline -->
  <text x="52" y="41" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Post-Discharge Recovery Companion</text>
</svg>
